name: Deploy Admin Web to Vercel
on:
  push:
    branches:
      - main
      - add_billing_service
    paths:
      - 'mem_pan_admin/admin-web/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install
        working-directory: ./mem_pan_admin/admin-web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        working-directory: ./mem_pan_admin/admin-web

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          VITE_AUTH_API_BASE_URL: "https://mempan-gateway-3hd0u0cm.uc.gateway.dev"
          VITE_ADMIN_API_BASE_URL: "https://mempan-gateway-3hd0u0cm.uc.gateway.dev"
          VITE_MAIN_APP_URL: "https://mem-pan-mb.vercel.app"
        working-directory: ./mem_pan_admin/admin-web

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        working-directory: ./mem_pan_admin/admin-web
